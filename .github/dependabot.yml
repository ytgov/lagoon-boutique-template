# Dependabot version updates for the template (prod11).
#
# Dependabot only reads this file from the repository's default branch
# (prod11). Keep identical copies on the other prod branches anyway, so the
# .github directory stays the same everywhere.
#
# Every PR runs the canary (see .github/workflows/canary.yml), so a bump that
# breaks a site built from the template fails before it can be merged.
#
# Not covered here:
# - Contrib modules and core. They come from the base image; bump them there.
# - The base images in lagoon/*.dockerfile. They use the moving :11.x tag,
#   which always points at the latest prod11 build.

version: 2
updates:
  # The template requires only ytgov/lagoon-boutique-base-image (dev-prod11),
  # so this proposes composer.lock refreshes when the base branch moves.
  - package-ecosystem: composer
    directory: /
    target-branch: prod11
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The MariaDB image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: prod11
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: prod11
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
