# Dependabot version updates. Copied unchanged into every site made from the
# template.
#
# Dependabot only reads this file from the repository's default branch, and
# opens its PRs against that branch (prod11 in the template, release-1 in a
# site), so no entry sets target-branch. Keep identical copies on the other
# release branches anyway, so the .github directory stays the same everywhere.
#
# Every PR runs the canary (see .github/workflows/canary.yml), so a bump that
# breaks a site built from the template fails before it can be merged.
#
# Core and the base's contrib modules come from the base; bump them there.

version: 2

# A base release is a composer version (^11.0) and the matching image tag
# (:11.0.0) in lagoon/*.dockerfile, so both are bumped in one PR. The canary
# workflow fails if they disagree.
multi-ecosystem-groups:
  base-release:
    schedule:
      interval: weekly

updates:
  # The base release. Sites' own extra modules are bumped in this PR too.
  - package-ecosystem: composer
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: base-release

  # The base images in lagoon/*.dockerfile. docker-compose.yml has no
  # lagoon.base.image labels: Lagoon uses them only to re-pull moving tags
  # such as :latest, and a release tag never changes.
  - package-ecosystem: docker
    directory: /lagoon
    patterns: ["*"]
    multi-ecosystem-group: base-release

  # The MariaDB image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
